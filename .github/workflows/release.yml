# Release-Build: bei jedem Tag vX.Y.Z eine signierte APK bauen und als GitHub-Release
# veröffentlichen. Der Release-Text stammt aus dem Fastlane-Changelog des versionCodes.
# F-Droid baut dasselbe Tag unabhängig davon selbst.
#
# Secrets wie in newpipe-healthcheck.yml.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore aus Secret wiederherstellen
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > yunemusic.jks

      - name: Signierte Release-APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "YuneMusic-${GITHUB_REF_NAME#v}.apk"
          sha256sum YuneMusic-*.apk > "YuneMusic-${GITHUB_REF_NAME#v}.apk.sha256"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'toIntOrNull\(\) \?: \K[0-9]+' app/build.gradle.kts)
          NOTES=fastlane/metadata/android/en-US/changelogs/${CODE}.txt
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" YuneMusic-*.apk YuneMusic-*.apk.sha256 \
            --title "YuneMusic ${GITHUB_REF_NAME#v}" --notes-file "$NOTES"

  # Eigenes F-Droid-Repo mit dem neuen Release aktualisieren
  fdroid:
    needs: release
    uses: ./.github/workflows/fdroid-repo.yml
    secrets: inherit
