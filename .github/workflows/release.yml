# Release-Build: bei jedem Tag vX.Y.Z eine signierte APK bauen und als GitHub-Release
# veröffentlichen. Der Release-Text stammt aus dem Fastlane-Changelog des versionCodes.
# F-Droid baut dasselbe Tag unabhängig davon selbst.
#
# Wird auch vom Health-Check aufgerufen (workflow_call), wenn er automatisch ein
# Hotfix-Tag angelegt hat — Tags, die mit dem GITHUB_TOKEN gepusht werden, lösen
# diesen Workflow sonst nicht aus.
#
# Secrets wie in newpipe-healthcheck.yml.

name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Zu veröffentlichendes Tag (vX.Y.Z)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore aus Secret wiederherstellen
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > yunemusic.jks

      - name: Signierte Release-APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "YuneMusic-${TAG#v}.apk"
          sha256sum YuneMusic-*.apk > "YuneMusic-${TAG#v}.apk.sha256"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'toIntOrNull\(\) \?: \K[0-9]+' app/build.gradle.kts)
          NOTES=fastlane/metadata/android/en-US/changelogs/${CODE}.txt
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$TAG" YuneMusic-*.apk YuneMusic-*.apk.sha256 \
            --title "YuneMusic ${TAG#v}" --notes-file "$NOTES"

  # Eigenes F-Droid-Repo mit dem neuen Release aktualisieren
  fdroid:
    needs: release
    uses: ./.github/workflows/fdroid-repo.yml
    secrets: inherit
